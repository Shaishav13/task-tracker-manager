<div class="login-wrapper animate-fade-in">
  <div class="theme-toggle-corner">
    <button 
      class="theme-toggle-btn" 
      (click)="themeService.toggleTheme()" 
      [attr.aria-label]="'Switch to ' + (themeService.theme() === 'dark' ? 'light' : 'dark') + ' mode'"
      [title]="'Switch to ' + (themeService.theme() === 'dark' ? 'light' : 'dark') + ' mode'"
    >
      <svg *ngIf="themeService.theme() === 'dark'" class="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
      <svg *ngIf="themeService.theme() === 'light'" class="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    </button>
  </div>

  <div class="login-card glass-card">
    <div class="login-header">
      <div class="brand-badge">TTM</div>
      <h2>Welcome Back</h2>
      <p class="login-subtitle">Sign in to your Task Tracker Manager workspace</p>
    </div>
    
    <form (ngSubmit)="onSubmit()" class="login-form">
      @if (errorMessage()) {
        <div class="alert-error" role="alert">
          <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <span>{{ errorMessage() }}</span>
        </div>
      }

      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-icon-wrapper">
          <input 
            id="email" 
            type="email" 
            [ngModel]="email()" 
            (ngModelChange)="email.set($event)"
            name="email" 
            placeholder="e.g. superadmin@company.local"
            required 
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-icon-wrapper">
          <input 
            id="password" 
            type="password" 
            [ngModel]="password()" 
            (ngModelChange)="password.set($event)"
            name="password" 
            placeholder="••••••••••••"
            required 
          />
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block">
        <span>Sign In to Dashboard</span>
        <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
    </form>

    <div class="login-footer">
      <span>Protected by enterprise RBAC governance & rate limiting</span>
    </div>
  </div>
</div>
