<div class="dashboard-layout animate-fade-in">
  <header class="topbar">
    <div class="brand">
      <div class="brand-logo">TTM</div>
      <div class="brand-text">
        <span class="brand-title">Task Tracker Manager</span>
        <span class="brand-subtitle">Enterprise Performance Portal</span>
      </div>
    </div>
    
    <div class="header-actions">
      <div class="user-info" *ngIf="authService.currentUser() as user">
        <div class="avatar-pill">
          <span class="user-name">{{ user.name || user.email }}</span>
          <span class="badge badge-primary">{{ user.role.name || user.role }}</span>
        </div>
      </div>
      
      <!-- Theme Switcher -->
      <button 
        class="theme-toggle-btn" 
        (click)="themeService.toggleTheme()" 
        [attr.aria-label]="'Switch to ' + (themeService.theme() === 'dark' ? 'light' : 'dark') + ' mode'"
        [title]="'Switch to ' + (themeService.theme() === 'dark' ? 'light' : 'dark') + ' mode'"
      >
        <svg *ngIf="themeService.theme() === 'dark'" class="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        <svg *ngIf="themeService.theme() === 'light'" class="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      </button>

      <button class="btn btn-secondary" *ngIf="userRole() === 'SUPER_ADMIN' || userRole() === 'ADMIN'" (click)="goToRoles()">
        Roles & Permissions
      </button>
      <button class="btn btn-secondary" (click)="goToTasks()">
        Task Board
      </button>
      <button class="btn btn-danger" (click)="logout()">
        Logout
      </button>
    </div>
  </header>

  <main class="content">
    <app-admin-dashboard *ngIf="userRole() === 'SUPER_ADMIN' || userRole() === 'ADMIN'"></app-admin-dashboard>
    <app-manager-dashboard *ngIf="userRole() === 'MANAGER'"></app-manager-dashboard>
    <app-lead-dashboard *ngIf="userRole() === 'TEAM_LEAD'"></app-lead-dashboard>
    <app-member-dashboard *ngIf="userRole() === 'TEAM_MEMBER'"></app-member-dashboard>
    
    <div *ngIf="!userRole()" class="loading-state">
      <div class="spinner"></div>
      <span>Loading dashboard workspace...</span>
    </div>
  </main>
</div>
